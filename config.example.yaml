# Copy this file to config.yaml and adjust non-secret preferences as needed.
# Provider credentials are accepted only through ANTHROPIC_API_KEY or
# OPENAI_API_KEY. Never put credentials in this file.

# Local-first example. Replace the model value with the exact ID returned by
# http://localhost:1234/v1/models after loading it in LM Studio.
provider: lmstudio
model: YOUR_LOCAL_MODEL_ID
base_url: http://localhost:1234/v1
# The current alpha's review and source-preparation stages require English captions.
source_lang: English
preset: top5

chunking:
  max_chunk_chars: 900
  gap_threshold_ms: 1200

output:
  output_root: outputs
  max_line_chars: 42
  min_entry_chars: 0
  bom: false
  skip_existing: false

# Optional path to a CSV containing term,translation pairs.
glossary: ""
